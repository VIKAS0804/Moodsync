[project]
name = "moodsync-server"
version = "0.1.0"
description = "FastAPI backend + mood-analysis pipeline for MoodSync"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.35",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in default arguments, which is exactly how FastAPI
# dependency injection is written (`= Depends(...)`, `= Query(...)`).
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
